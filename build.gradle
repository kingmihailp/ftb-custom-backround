plugins {
    id 'java'
    id 'net.neoforged.gradle.userdev' version '7.0.142'
}

version = project.mod_version
group = project.mod_group_id

base {
    archivesName = project.mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

runs {
    configureEach {
        systemProperty 'forge.logging.markers', 'REGISTRIES'
        systemProperty 'forge.logging.console.level', 'debug'
        modSource project.sourceSets.main
    }

    client {
        systemProperty 'forge.enabledGameTestNamespaces', project.mod_id
    }
}

dependencies {
    implementation "net.neoforged:neoforge:${project.neo_version}"

    // No compile-time dependency on FTB Quests / FTB Library is needed.
    // The mixin uses string-based class targeting (@Mixin targets = "..."),
    // and none of our source files import any FTB classes directly.
    // At runtime the mod simply does nothing when FTB Quests is absent.
}

tasks.withType(ProcessResources).configureEach {
    def replaceProperties = [
        minecraft_version: project.minecraft_version,
        neo_version      : project.neo_version,
        mod_id           : project.mod_id,
        mod_name         : project.mod_name,
        mod_license      : project.mod_license,
        mod_version      : project.mod_version,
        mod_authors      : project.mod_authors,
        mod_description  : project.mod_description,
    ]
    inputs.properties replaceProperties
    filesMatching(['META-INF/neoforge.mods.toml']) {
        expand replaceProperties
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

jar {
    manifest {
        attributes([
            'Specification-Title'   : project.mod_id,
            'Specification-Version' : '1',
            'Implementation-Title'  : project.name,
            'Implementation-Version': project.jar.archiveVersion,
        ])
    }
}
