modLoader="javafml"
loaderVersion="[1,)"
license="${mod_license}"

[[mods]]
    modId="${mod_id}"
    version="${mod_version}"
    displayName="${mod_name}"
    description="${mod_description}"
    authors="${mod_authors}"

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="[21.1,)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="[1.21.1,1.22)"
    ordering="NONE"
    side="BOTH"

# FTB Quests is optional – the mod gracefully does nothing when it is absent.
[[dependencies.${mod_id}]]
    modId="ftbquests"
    type="optional"
    versionRange="[*,)"
    ordering="NONE"
    side="CLIENT"

[[mixins]]
    config="mixins.ftbcustombg.json"
